name: Build and Release

on:
  push:
    branches: [ "master" ]
    tags: [ "v*", "testpublish/*" ]
  pull_request:
    branches: [ "master" ]

permissions: write-all

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: |
          6.0.x
          8.0.x

    - name: Restore dependencies
      run: dotnet restore JsonSettings.sln
      
    - name: Build
      run: dotnet build JsonSettings.sln --configuration Release --no-restore
      
    - name: Test
      run: dotnet test JsonSettings.sln --configuration Release --no-build --verbosity normal --logger trx --collect:"XPlat Code Coverage"
      
    - name: Upload Coverage Reports
      uses: actions/upload-artifact@v4
      with:
        name: coverage-reports
        path: |
          **/*.cobertura.xml
        retention-days: 5

    - name: Upload Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: ${{ github.workspace }}/**/TestResults/**/*
        retention-days: 5

  report:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Download Coverage Reports
      uses: actions/download-artifact@v4
      with:
        name: coverage-reports
        
    - name: Download Test Results
      uses: actions/download-artifact@v4
      with:
        name: test-results

    - name: Combine Coverage Reports
      uses: danielpalme/ReportGenerator-GitHub-Action@5.2.4
      with:
        reports: "**/*.cobertura.xml"
        targetdir: "${{ github.workspace }}"
        reporttypes: "Cobertura"
        verbosity: "Info"
        title: "Code Coverage"
        tag: "${{ github.run_number }}_${{ github.run_id }}"

    - name: Publish Code Coverage Report
      uses: irongut/CodeCoverageSummary@v1.3.0
      with:
        filename: "Cobertura.xml"
        badge: true
        fail_below_min: false
        format: markdown
        hide_branch_rate: false
        hide_complexity: false
        indicators: true
        output: both
        thresholds: "10 30"

    - name: Add Coverage PR Comment
      uses: marocchino/sticky-pull-request-comment@v2
      if: github.event_name == 'pull_request'
      with:
        recreate: true
        path: code-coverage-results.md

    - name: Publish Test Results
      uses: EnricoMi/publish-unit-test-result-action@v2.16.1
      if: always()
      with:
        files: "**/*.trx"

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/testpublish/')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        framework: ['net48', 'net6.0-windows', 'net8.0-windows']
        runtime: ['win-x64', 'win-x86']
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: |
          6.0.x
          8.0.x

    - name: Extract Version
      id: get_version
      shell: bash
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        # Remove everything after hyphen for AssemblyVersion
        ASSEMBLY_VERSION=${VERSION%%-*}
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "ASSEMBLY_VERSION=$ASSEMBLY_VERSION" >> $GITHUB_OUTPUT

  create-release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v3

    - name: Generate Release Notes
      id: release-notes
      shell: pwsh
      run: |
        $notes = ./.github/get-release-notes.ps1 -CurrentTag $env:GITHUB_REF
        $notes = $notes -replace "'", "''"
        echo "RELEASE_NOTES<<EOF" >> $env:GITHUB_OUTPUT
        echo "$notes" >> $env:GITHUB_OUTPUT
        echo "EOF" >> $env:GITHUB_OUTPUT

    - name: Check if Prerelease
      id: check_prerelease
      shell: pwsh
      run: |
        $isPrerelease = $env:GITHUB_REF -match '.*(-alpha|-beta|-prerelease).*'
        "IS_PRERELEASE=$isPrerelease" >> $env:GITHUB_OUTPUT

  publish-nuget:
    needs: create-release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: |
          6.0.x
          8.0.x

    - name: Extract Version
      id: get_version
      shell: pwsh
      run: |
        $version = $env:GITHUB_REF -replace 'refs/tags/v', ''
        "VERSION=$version" >> $env:GITHUB_OUTPUT

    - name: Check if Prerelease
      id: check_prerelease
      shell: pwsh
      run: |
        $isPrerelease = $env:GITHUB_REF -match '.*(-alpha|-beta|-prerelease).*'
        "IS_PRERELEASE=$isPrerelease" >> $env:GITHUB_OUTPUT

    - name: Build & Pack (Release)
      if: steps.check_prerelease.outputs.IS_PRERELEASE != 'True'
      run: |
        $outputPath = Join-Path $env:GITHUB_WORKSPACE "artifacts/nuget"
        dotnet build $env:GITHUB_WORKSPACE/src/JsonSettings/JsonSettings.csproj --configuration Release -p:Version=${{ steps.get_version.outputs.VERSION }} -p:AssemblyVersion=${{ steps.get_version.outputs.ASSEMBLY_VERSION }}
        dotnet pack $env:GITHUB_WORKSPACE/src/JsonSettings/JsonSettings.csproj --configuration Release --output $outputPath --no-build -p:Version=${{ steps.get_version.outputs.VERSION }} -p:AssemblyVersion=${{ steps.get_version.outputs.ASSEMBLY_VERSION }}
        dir $outputPath

    - name: Build & Pack (Prerelease)
      if: steps.check_prerelease.outputs.IS_PRERELEASE == 'True'
      run: |
        $outputPath = Join-Path $env:GITHUB_WORKSPACE "artifacts/nuget"
        dotnet build $env:GITHUB_WORKSPACE/JsonSettings/JsonSettings.csproj --configuration Release -p:Version=${{ steps.get_version.outputs.VERSION }} -p:AssemblyVersion=${{ steps.get_version.outputs.ASSEMBLY_VERSION }}
        dotnet pack $env:GITHUB_WORKSPACE/JsonSettings/JsonSettings.csproj --configuration Release --output $outputPath --no-build -p:Version=${{ steps.get_version.outputs.VERSION }} -p:AssemblyVersion=${{ steps.get_version.outputs.ASSEMBLY_VERSION }}
        dir $outputPath

    - name: Push to NuGet
      run: |
        $outputPath = Join-Path $env:GITHUB_WORKSPACE "artifacts/nuget"
        $package = Get-ChildItem $outputPath -Filter *.nupkg | Select-Object -First 1
        if ($package) {
            dotnet nuget push $package.FullName --api-key ${{ secrets.NUGETAPIKEY }} --source https://api.nuget.org/v3/index.json
        } else {
            Write-Error "No .nupkg file found in $outputPath"
            exit 1
        }
